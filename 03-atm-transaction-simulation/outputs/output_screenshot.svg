<text x="24" y="207" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">Txn 2 (W, 3000): ACCEPTED - New Balance: Rs. 9500.00</text>
<text x="24" y="229" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">Txn 3 (W, 5500): REJECTED - Exceeds single limit (Rs. 5000).</text>
