<svg xmlns="http://www.w3.org/2000/svg" width="760" height="498" viewBox="0 0 760 498">
<rect width="760" height="498" rx="10" fill="#0F172A"/>
<rect width="760" height="40" rx="10" fill="#1E293B"/>
<rect y="30" width="760" height="10" fill="#1E293B"/>
<circle cx="22" cy="20" r="6" fill="#EF4444"/>
<circle cx="42" cy="20" r="6" fill="#F59E0B"/>
<circle cx="62" cy="20" r="6" fill="#10B981"/>
<text x="88" y="25" font-family="Menlo, Monaco, monospace" font-size="13" font-weight="bold" fill="#E2E8F0">Terminal — Password Policy Validation Engine (password_validator.py)</text>
<text x="24" y="75" font-family="Menlo, Monaco, monospace" font-size="14" fill="#38BDF8" xml:space="preserve">$ python3 password_validator.py</text>
<text x="24" y="97" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve"></text>
<text x="24" y="119" font-family="Menlo, Monaco, monospace" font-size="14" fill="#FBBF24" xml:space="preserve">=== PASSWORD POLICY VALIDATION REPORT ===</text>
<text x="24" y="141" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve"></text>
<text x="24" y="163" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">Password: Campus@2026 -&gt; VALID</text>
<text x="24" y="185" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve"></text>
<text x="24" y="207" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">Password: abc12 -&gt; INVALID</text>
<text x="24" y="229" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">  - Minimum length of 8 characters not met</text>
<text x="24" y="251" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">  - Missing uppercase letter</text>
<text x="24" y="273" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">  - Missing special character (@#$%&amp;*!)</text>
<text x="24" y="295" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve"></text>
<text x="24" y="317" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">Password: Admin@1234 -&gt; INVALID</text>
<text x="24" y="339" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">  - Contains prohibited substring &#x27;admin&#x27;</text>
<text x="24" y="361" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">  - Contains prohibited substring &#x27;1234&#x27;</text>
<text x="24" y="383" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve"></text>
<text x="24" y="405" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">Password: Strong###9 -&gt; INVALID</text>
<text x="24" y="427" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">  - Contains 3+ consecutive repeated characters</text>
<text x="24" y="449" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve"></text>
<text x="24" y="471" font-family="Menlo, Monaco, monospace" font-size="14" fill="#E2E8F0" xml:space="preserve">Password: NriuCse!26 -&gt; VALID</text>
</svg>