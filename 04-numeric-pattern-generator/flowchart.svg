<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1010" viewBox="0 0 640 1010">
<rect width="640" height="1010" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4B5563"/></marker></defs>
<text x="320" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E3A5F">Flowchart: Advanced Numeric Pattern Generator</text>
<rect x="200" y="89" width="240" height="52" rx="26" fill="#1E3A5F"/>
<text x="320" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Start</text>
<line x1="320" y1="146" x2="320" y2="198" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="170,258 450,258 470,202 190,202" fill="#E8F1FA" stroke="#2563EB" stroke-width="2"/>
<text x="320" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937">Read dimension n</text>
<text x="320" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937">from test list</text>
<line x1="320" y1="261" x2="320" y2="305" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="320,309 475,345 320,381 165,345" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="320" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#78350F">Is 2 &lt;= n &lt;= 9?</text>
<line x1="320" y1="384" x2="320" y2="428" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="170,488 450,488 470,432 190,432" fill="#E8F1FA" stroke="#2563EB" stroke-width="2"/>
<text x="320" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937">Print validation error</text>
<text x="320" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937">for invalid n</text>
<line x1="320" y1="491" x2="320" y2="543" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="165" y="547" width="310" height="56" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="320" y="571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111827">Upper half loop (1 to n):</text>
<text x="320" y="589" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111827">print outer spaces + digits</text>
<line x1="320" y1="606" x2="320" y2="658" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="165" y="662" width="310" height="56" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="320" y="686" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111827">Lower half loop (n-1 to 1):</text>
<text x="320" y="704" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111827">print outer spaces + digits</text>
<line x1="320" y1="721" x2="320" y2="773" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="170,833 450,833 470,777 190,777" fill="#E8F1FA" stroke="#2563EB" stroke-width="2"/>
<text x="320" y="801" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937">Display aligned hollow</text>
<text x="320" y="819" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937">numeric diamond</text>
<line x1="320" y1="836" x2="320" y2="888" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="200" y="894" width="240" height="52" rx="26" fill="#1E3A5F"/>
<text x="320" y="925" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Stop</text>
</svg>